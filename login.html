<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire Marshal Login</title>
    <link rel="stylesheet" href="css/your-styles.css"> <!-- Use your existing styles -->
</head>
<body>
    <div class="login-container">
        <h1>Fire Marshal Login</h1>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit">Login</button>
        </form>
        <div id="message"></div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');
            
            try {
                const response = await fetch('/.netlify/functions/auth', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    window.location.href = 'dashboard.html'; // Redirect to your dashboard
                } else {
                    messageDiv.textContent = 'Invalid credentials. Please try again.';
                    messageDiv.style.color = 'red';
                }
            } catch (error) {
                console.error('Login error:', error);
                messageDiv.textContent = 'Login failed. Please try again later.';
                messageDiv.style.color = 'red';
            }
        });
    </script>
</body>
</html>
