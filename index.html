<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Risk Reduction</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .emblem {
            margin-top: 30px;
            margin-bottom: 20px;
            max-width: 200px;
            width: 100%;
            height: auto;
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: float 6s ease-in-out infinite;
            border: 3px solid rgba(255, 255, 255, 0.8);
            background-color: white;
        }
        
        .title {
            font-size: 3.5rem;
            font-weight: 700;
            color: #fff;
            text-align: center;
            margin-bottom: 40px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
            letter-spacing: 1px;
            position: relative;
            padding: 0 20px;
        }
        
        .title::after {
            content: '';
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 3px;
            background: linear-gradient(90deg, #ff9a56, #ff6a88, #d57eeb);
            border-radius: 10px;
        }
        
        .subheadings {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 100%;
            margin-top: 20px;
            margin-bottom: 40px;
        }
        
        .subheading {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .subheading:hover {
            transform: translateY(-5px);
            background: linear-gradient(45deg, #f093fb, #f5576c);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        
        .subheading a {
            text-decoration: none;
            color: #333;
            font-size: 1.2rem;
            font-weight: 500;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .subheading:hover a {
            color: white;
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        
        @media (max-width: 768px) {
            .title { font-size: 2.5rem; }
            .subheadings { grid-template-columns: 1fr; }
        }

        /* Modal Styles - simplified */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            background-color: #fff;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            width: 100%;
            max-width: 1200px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 28px;
            cursor: pointer;
            color: #aaa;
        }

        .close-modal:hover { color: #333; }

        /* Table Styles - simplified */
        .csv-grid {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .csv-grid th {
            background: #1a2a6c;
            color: white;
            font-weight: 600;
            padding: 12px 15px;
            text-align: left;
        }

        .csv-grid td {
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        .csv-grid tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        /* Progress Bar - simplified */
        .progress-bar-container {
            width: 100%;
            height: 20px;
            background-color: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
        }

        .progress-bar {
            height: 100%;
            background: #28a745;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">Hazelwood Fire Department<br>Fire Marshal Dashboard</h1>
        
        <div class="subheadings">
            <div class="subheading">
                <a href="https://hazelwoodmo.sharepoint.com/:x:/r/sites/FirePreventionBureau/_layouts/15/Doc.aspx?sourcedoc=%7B9CDFA0B9-3A45-45FD-B450-87CE96CD24BC%7D&file=Inspection%20list.xlsx&action=default&mobileredirect=true" target="_blank">Inspections</a>
            </div>
            <div class="subheading">
                <a href="https://civicgov4.com/mo_hazelwood/dashboard" target="_blank">Permits</a>
            </div>
            <div class="subheading">
                <a href="#">Investigations</a>
            </div>
            <div class="subheading">
                <a href="#">Smoke Detectors</a>
            </div>
            <div class="subheading">
                <a href="#">Violations</a>
            </div>
            <div class="subheading">
                <a href="#">Code Modifications</a>
            </div>
            <div class="subheading">
                <a href="#">Code Adoptions</a>
            </div>
            <div class="subheading">
                <a href="#">Occupancies (by type etc)</a>
            </div>
            <div class="subheading">
                <a href="#">Structures (By component etc)</a>
            </div>
            <div class="subheading">
                <a href="#">Fire Drills</a>
            </div>
            <div class="subheading">
                <a href="#">Brycer (ITM)</a>
            </div>
            <div class="subheading">
                <a href="#" id="siteProgressButton">Site Progress</a>
            </div>
        </div>
        
        <img class="emblem" src="https://github.com/sgwelsh/Media/blob/main/VeniceAI_Os8SsvW.png?raw=true" alt="Community Risk Reduction Emblem">
    </div>

    <!-- Modal - simplified structure -->
    <div id="reportsModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Website Development Progress</h2>
            <div id="csvTableContainer">
                <p>Loading data...</p>
            </div>
        </div>
    </div>
    
    <script>
        // Simplified script - removed ripple effects and SharePoint access checking
        
        // Modal functionality
        const modal = document.getElementById('reportsModal');
        const modalBtn = document.getElementById('siteProgressButton');
        const closeBtn = document.querySelector('.close-modal');
        const tableContainer = document.getElementById('csvTableContainer');
        
        modalBtn.addEventListener('click', function() {
            modal.style.display = 'block';
            loadCSVData();
        });
        
        closeBtn.addEventListener('click', function() {
            modal.style.display = 'none';
        });
        
        window.addEventListener('click', function(event) {
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        });
        
        // Function to load CSV data
        function loadCSVData() {
            tableContainer.innerHTML = '<p>Loading data...</p>';
            
            // Try direct relative path first
            fetch('Progress.csv')
                .then(response => {
                    if (!response.ok) throw new Error('Direct fetch failed');
                    return response.text();
                })
                .then(csvData => {
                    displayCSVData(csvData);
                })
                .catch(error => {
                    // Try GitHub raw URL as fallback
                    fetch('https://raw.githubusercontent.com/sgwelsh/hazelwood-fire-dashboard/main/Progress.csv')
                        .then(response => {
                            if (!response.ok) throw new Error('GitHub fetch failed');
                            return response.text();
                        })
                        .then(csvData => {
                            displayCSVData(csvData);
                        })
                        .catch(error => {
                            tableContainer.innerHTML = '<p>Error loading data. Please check if Progress.csv exists.</p>';
                        });
                });
        }
        
        // Function to display CSV data in a table
        function displayCSVData(csvData) {
            const rows = csvData.split('\n');
            let tableHTML = '<table class="csv-grid">';
            
            rows.forEach((row, index) => {
                if (row.trim() === '') return;
                
                tableHTML += '<tr>';
                const cells = row.split(',');
                
                cells.forEach(cell => {
                    const cellContent = cell.trim();
                    const tag = index === 0 ? 'th' : 'td';
                    
                    // Check for percentage and create progress bar
                    if (cellContent.includes('%') && index > 0) {
                        const percentage = parseInt(cellContent.replace('%', '').trim());
                        tableHTML += `
                            <${tag}>
                                <div>${cellContent.replace(/%/g, '')}%</div>
                                <div class="progress-bar-container">
                                    <div class="progress-bar" style="width: ${percentage}%"></div>
                                </div>
                            </${tag}>
                        `;
                    } else {
                        tableHTML += `<${tag}>${cellContent}</${tag}>`;
                    }
                });
                
                tableHTML += '</tr>';
            });
            
            tableHTML += '</table>';
            tableContainer.innerHTML = tableHTML;
        }
    </script>
</body>
</html>
