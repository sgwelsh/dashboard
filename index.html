<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Risk Reduction</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .emblem {
            margin-top: 30px;
            margin-bottom: 20px;
            max-width: 200px;
            width: 100%;
            height: auto;
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: float 6s ease-in-out infinite;
            border: 3px solid rgba(255, 255, 255, 0.8);
            background-color: white;
        }
        
        .title {
            font-size: 3.5rem;
            font-weight: 700;
            color: #fff;
            text-align: center;
            margin-bottom: 40px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
            letter-spacing: 1px;
            position: relative;
            padding: 0 20px;
        }
        
        .title::after {
            content: '';
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 3px;
            background: linear-gradient(90deg, #ff9a56, #ff6a88, #d57eeb);
            border-radius: 10px;
        }
        
        .subheadings {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 100%;
            margin-top: 20px;
            margin-bottom: 40px;
        }
        
        .subheading {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .subheading:hover {
            transform: translateY(-5px);
            background: linear-gradient(45deg, #f093fb, #f5576c);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        
        .subheading a {
            text-decoration: none;
            color: #333;
            font-size: 1.2rem;
            font-weight: 500;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .subheading:hover a {
            color: white;
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        
        @media (max-width: 768px) {
            .title { font-size: 2.5rem; }
            .subheadings { grid-template-columns: 1fr; }
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            background-color: #fff;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            width: 100%;
            max-width: 1200px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 28px;
            cursor: pointer;
            color: #aaa;
        }

        .close-modal:hover { color: #333; }

        .csv-grid {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .csv-grid th {
            background: #1a2a6c;
            color: white;
            font-weight: 600;
            padding: 12px 15px;
            text-align: left;
        }

        .csv-grid td {
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        .csv-grid tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        .progress-bar-container {
            width: 100%;
            height: 20px;
            background-color: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
        }

        .progress-bar {
            height: 100%;
            background: #28a745;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">Hazelwood Fire Department<br>Fire Marshal Dashboard</h1>
